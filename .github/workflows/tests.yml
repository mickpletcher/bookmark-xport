name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Install locked dependencies and package
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Verify installed package and entry point
        run: |
          python -m pip check
          python -c "import bookmark_exporter; assert bookmark_exporter.__version__ == '0.1.0'"
          python -c "from importlib.metadata import entry_points; assert any(ep.name == 'bookmark-xport' and callable(ep.load()) for ep in entry_points(group='gui_scripts'))"

      - name: Run tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cov=bookmark_exporter --cov-report=term-missing --cov-fail-under=80

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies and package
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Lint, format, and type check
        run: |
          python -m ruff check src tests scripts
          python -m ruff format src tests scripts --check
          python -m mypy src tests scripts

      - name: Check living documentation
        shell: pwsh
        run: ./scripts/docs-check.ps1 -FailOnGap

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies and package
        run: |
          python -m pip install --requirement requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps --editable .

      - name: Build and smoke test bundle
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python scripts/build.py
          python scripts/smoke_bundle.py

      - uses: actions/upload-artifact@v7
        with:
          name: bookmark-xport-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
