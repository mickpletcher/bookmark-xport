[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookmark-xport"
version = "0.1.0"
description = "Export a single browser bookmark folder to a portable HTML file."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = [
    "mypy>=1.17",
    "pip-tools>=7.5",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-qt>=4.4",
    "ruff>=0.12",
]

[project.gui-scripts]
bookmark-xport = "bookmark_exporter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["bookmark_exporter"]
strict = true

[tool.coverage.run]
branch = true
source = ["bookmark_exporter"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
